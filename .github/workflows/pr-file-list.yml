name: PR File Listener

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write  # Ez KÖTELEZŐ, hogy tudjon kommentelni
  contents: read        # Hogy lássa a fájlokat

jobs:
  list-changed-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fontos: le kell tölteni a history-t, hogy tudjon diff-elni
          fetch-depth: 0

      - name: Get changed files
        id: diff
        run: |
          # Lekérjük a cél branch (pl. main) adatait az összehasonlításhoz
          git fetch origin ${{ github.base_ref }}
          
          # Kigyűjtjük a fájlneveket
          # A "origin/${{ github.base_ref }}" a cél (pl. main)
          # A "HEAD" a te mostani verziód
          CHANGES=$(git diff --name-only origin/${{ github.base_ref }} HEAD)
          
          # Ha nincs változás (elvileg lehetetlen PR-nél, de biztos ami biztos)
          if [ -z "$CHANGES" ]; then
            echo "No files changed."
            echo "files_list=Nincs változás" >> $GITHUB_OUTPUT
          else
            # A sortöréseket lecseréljük, hogy át tudjuk adni a következő lépésnek
            # Ez egy kis bash mágia a többsoros stringek kezelésére GitHub Actions-ben
            echo "files_list<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // 1. Beszerezzük a fájllistát az előző lépésből
            const fileList = `${{ steps.diff.outputs.files_list }}`;
            
            // 2. Összeállítjuk a komment szövegét
            const commentBody = `### 📋 Érintett fájlok listája
            
            Ezeket a fájlokat módosítja ez a Pull Request:
            
            \`\`\`text
            ${fileList}
            \`\`\`
            
            _Automatikusan generálva a CI által._ 🤖`;

            // 3. Megkeressük, van-e már komment a robottól
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes('📋 Érintett fájlok listája');
            });

            // 4. Ha van, frissítjük. Ha nincs, újat írunk.
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }